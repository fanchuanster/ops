# NobleSee — Next.js 16 + React + TypeScript with Payload 3 embedded as
# CMS and admin, on PostgreSQL 18.
#
#   docker compose up -d                        the site
#   docker compose --profile tunnel up -d       ...published on noblesee.com
#   docker compose --profile tools up -d        ...plus Adminer for DB inspection
#   docker compose --profile seed run --rm appseed   seed the catalog
services:
  # Publishes the site on the public domain without opening a port on
  # this host: cloudflared dials OUT to Cloudflare and traffic arrives
  # back down that connection. Cloudflare terminates TLS at its edge, so
  # the origin hop stays plain HTTP inside the compose network — which is
  # why NEXT_PUBLIC_SERVER_URL has to name the public origin explicitly:
  # the app cannot infer it from the request it actually receives.
  #
  # This is a REMOTELY-MANAGED tunnel: the token below is issued by
  # Cloudflare Zero Trust > Networks > Tunnels, and the public hostname
  # -> service mapping is configured THERE rather than in a local config
  # file, so it is not visible in this repo. The ingress rule must read
  #
  #     noblesee.com -> http://app:3000
  #
  # Leave CLOUDFLARE_TUNNEL_TOKEN unset and this service simply won't
  # start, so local-only development is unaffected.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # --- NobleSee application (docs/MODERNIZATION.md) ---------------------
  # Next.js 16 + React + TypeScript with Payload 3 embedded as the CMS
  # and admin, on PostgreSQL 18. Payload 3 runs *inside* the Next app
  # rather than beside it, so this is one service, not two.
  appdb:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noblesee}
      POSTGRES_USER: ${POSTGRES_USER:-noblesee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noblesee}
    volumes:
      # PostgreSQL 18+ changed its data layout: the image now stores the
      # cluster in a major-version subdirectory and wants the mount one
      # level up, at /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes it refuse to start.
      - appdb_data:/var/lib/postgresql
    # No host port: reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noblesee} -d ${POSTGRES_DB:-noblesee}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot schema migration, run before the app serves traffic.
  # Payload's Postgres adapter does not auto-create tables outside dev,
  # so this is explicit and versioned in apps/web/src/migrations. It
  # targets the builder stage because the runtime image is Next's
  # standalone output, which deliberately omits the Payload CLI.
  appmigrate:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    depends_on:
      appdb:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-noblesee}:${POSTGRES_PASSWORD:-noblesee}@appdb:5432/${POSTGRES_DB:-noblesee}
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env - generate one with openssl rand -hex 32}"
      NODE_ENV: production
    command: ["npx", "payload", "migrate"]
    restart: "no"

  # One-shot catalog seed: the two reference books and the curatorial
  # collections. Profile-gated rather than automatic — it is idempotent,
  # but it updates in place, so running it on every `up` would quietly
  # revert an editor's changes to those two books.
  #
  #   docker compose --profile seed run --rm appseed
  appseed:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    profiles: ["seed"]
    depends_on:
      appdb:
        condition: service_healthy
      appmigrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-noblesee}:${POSTGRES_PASSWORD:-noblesee}@appdb:5432/${POSTGRES_DB:-noblesee}
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env - generate one with openssl rand -hex 32}"
      NODE_ENV: production
    command: ["npm", "run", "seed"]
    restart: "no"

  app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      appdb:
        condition: service_healthy
      appmigrate:
        condition: service_completed_successfully
    ports:
      # 3000 on this host is taken by an unrelated container
      # (open-webui); 8090/8091 are WordPress and Adminer.
      - "8093:3000"
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-noblesee}:${POSTGRES_PASSWORD:-noblesee}@appdb:5432/${POSTGRES_DB:-noblesee}
      # Required, and deliberately has no default: sessions are signed
      # with it, so a value that changes on restart would silently log
      # everyone out — and a shared default committed to the repo would
      # let anyone forge a session on a public deployment.
      PAYLOAD_SECRET: "${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env - generate one with openssl rand -hex 32}"
      # The site's own public origin. Payload uses it to build absolute
      # URLs and to scope CSRF/CORS, so behind the tunnel it must be the
      # public name rather than the container's own host:port.
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_SITE_URL:-http://localhost:8093}
      # Object storage is Cloudflare R2 over the S3 API. The
      # CLOUDFLARE_S3_* fallbacks are the names the previous
      # implementation already used in .env, so one set of credentials
      # serves both stacks during the changeover. Left blank, Payload
      # falls back to local disk and the stack still runs with no cloud
      # account.
      R2_ENDPOINT: ${R2_ENDPOINT:-${CLOUDFLARE_S3_ENDPOINTS:-}}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-${CLOUDFLARE_S3_ACCESS_KEY_ID:-}}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-${CLOUDFLARE_S3_SECRET_ACCESS_KEY:-}}
      R2_BUCKET: ${R2_BUCKET:-noblesee}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Dev-only DB inspection. Not part of the production architecture, so
  # it stays off unless asked for: `--profile tools`.
  adminer:
    image: adminer:latest
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: appdb

volumes:
  appdb_data:
