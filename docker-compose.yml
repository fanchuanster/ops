services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # wordpress:cli's bundled MariaDB client can't load MySQL 8's default
    # caching_sha2_password auth plugin — use the legacy plugin instead.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-noblesee}
      MYSQL_USER: ${MYSQL_USER:-noblesee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-noblesee}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-noblesee}
    volumes:
      - db_data:/var/lib/mysql
    # No host port published — only reachable from other services on the
    # compose network. Reduces attack surface; use `adminer` (below) or
    # `docker compose exec db mysql ...` for inspection.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-noblesee}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    # Extends wordpress:php8.3-apache with WP-CLI and the noblesee-core
    # plugin's Composer deps (aws/aws-sdk-php, for R2 storage) baked in
    # at build time — see wordpress/Dockerfile.
    build:
      context: ./wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-noblesee}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-noblesee}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-noblesee}
      # R2 (S3-compatible) storage for book artifacts — see
      # includes/storage.php. Left unset in local dev without an R2
      # account: storage.php falls back to local WP uploads whenever
      # these are blank, so the site keeps working without them.
      CLOUDFLARE_S3_ENDPOINTS: ${CLOUDFLARE_S3_ENDPOINTS:-}
      CLOUDFLARE_S3_ACCESS_KEY_ID: ${CLOUDFLARE_S3_ACCESS_KEY_ID:-}
      CLOUDFLARE_S3_SECRET_ACCESS_KEY: ${CLOUDFLARE_S3_SECRET_ACCESS_KEY:-}
      NR_R2_BUCKET: ${NR_R2_BUCKET:-noblesee}
      # Google sign-up (includes/social-login.php). Same fallback
      # pattern: the "Continue with Google" button only appears once
      # both are set.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # No X-Forwarded-Proto handling needed here: the official WordPress
      # image already trusts that header in its generated wp-config.php,
      # which is what keeps is_ssl() true behind the Cloudflare Tunnel
      # (the origin hop inside the compose network is plain HTTP).
    volumes:
      - wp_data:/var/www/html
      # NobleSee's own plugin is developed in-repo and bind-mounted in —
      # everything else (WP core, Kadence) is installed at provision time
      # into the wp_data volume, not vendored in the repo.
      - ./wordpress/plugins/noblesee-core:/var/www/html/wp-content/plugins/noblesee-core
      # ...except vendor/: a named volume nested inside the bind mount
      # above, so the Composer deps baked into the image at build time
      # (see Dockerfile) aren't shadowed by the live-edit mount, without
      # having to enumerate every plugin subdirectory by hand. Docker
      # seeds it from the image the first time it's created; if
      # composer.json/.lock change, `docker compose down` and remove
      # this volume (or `docker compose build --no-cache wordpress`
      # then recreate it) to pick up the new deps.
      - nr_core_vendor:/var/www/html/wp-content/plugins/noblesee-core/vendor

  # One-shot provisioning: installs WordPress, activates the theme and
  # plugin, and seeds sample content. Runs once per fresh volume and
  # exits — re-running `docker compose up` is a no-op (see provision.sh
  # and seed-import.php, both written to be idempotent).
  provision:
    image: wordpress:cli-2.10
    # wordpress:cli's default www-data user can't traverse this repo's
    # host directories (mode 750) for the bind mounts below; run as root
    # instead (provision.sh already passes --allow-root to every wp call).
    user: root
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-noblesee}
      WORDPRESS_DB_USER: ${MYSQL_USER:-noblesee}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-noblesee}
      WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost:8090}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE:-NobleSee}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-admin}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@noblesee.com}
      NR_DOWNLOAD_LIMIT_PER_DAY: ${NR_DOWNLOAD_LIMIT_PER_DAY:-5}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/plugins/noblesee-core:/var/www/html/wp-content/plugins/noblesee-core
      - ./provisioning:/provisioning:ro
    entrypoint: ["/bin/sh", "/provisioning/provision.sh"]
    restart: "no"

  # Publishes the site on the public domain without opening a port on
  # this host: cloudflared dials OUT to Cloudflare and traffic arrives
  # back down that connection. Cloudflare terminates TLS at its edge, so
  # the origin hop stays plain HTTP inside the compose network (hence the
  # X-Forwarded-Proto handling on the wordpress service above).
  #
  # This is a REMOTELY-MANAGED tunnel: the token below is issued by
  # Cloudflare Zero Trust > Networks > Tunnels, and the public hostname
  # -> service mapping (noblesee.com -> http://wordpress:80) is
  # configured there rather than in a local config file. Leave
  # CLOUDFLARE_TUNNEL_TOKEN unset and this service simply won't start,
  # so local-only development is unaffected.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - wordpress
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # --- NobleSee application (docs/MODERNIZATION.md) ---------------------
  # Next.js 16 + React + TypeScript with Payload 3 embedded as the CMS
  # and admin, on PostgreSQL 18. Payload 3 runs *inside* the Next app
  # rather than beside it, so this is one service, not two.
  appdb:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noblesee}
      POSTGRES_USER: ${POSTGRES_USER:-noblesee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noblesee}
    volumes:
      # PostgreSQL 18+ changed its data layout: the image now stores the
      # cluster in a major-version subdirectory and wants the mount one
      # level up, at /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes it refuse to start.
      - appdb_data:/var/lib/postgresql
    # No host port: reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noblesee} -d ${POSTGRES_DB:-noblesee}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot schema migration, run before the app serves traffic.
  # Payload's Postgres adapter does not auto-create tables outside dev,
  # so this is explicit and versioned in apps/web/src/migrations. It
  # targets the builder stage because the runtime image is Next's
  # standalone output, which deliberately omits the Payload CLI.
  appmigrate:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    depends_on:
      appdb:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-noblesee}:${POSTGRES_PASSWORD:-noblesee}@appdb:5432/${POSTGRES_DB:-noblesee}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-only-insecure-secret}
      NODE_ENV: production
    command: ["npx", "payload", "migrate"]
    restart: "no"

  app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      appdb:
        condition: service_healthy
      appmigrate:
        condition: service_completed_successfully
    ports:
      # 3000 on this host is taken by an unrelated container
      # (open-webui); 8090/8091 are WordPress and Adminer.
      - "8093:3000"
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-noblesee}:${POSTGRES_PASSWORD:-noblesee}@appdb:5432/${POSTGRES_DB:-noblesee}
      # Required. Sessions are signed with it, so a value that changes
      # on restart would silently log everyone out.
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-only-insecure-secret}
      # Object storage is Cloudflare R2 over the S3 API. Left blank,
      # Payload falls back to local disk so the stack runs with no
      # cloud account.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-noblesee}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Dev-only DB inspection (e.g. checking wp_nr_downloads directly).
  # Not part of the production architecture.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  wp_data:
  nr_core_vendor:
  appdb_data:
